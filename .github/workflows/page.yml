# 工作流名称，会显示在 GitHub Actions 页面上
name: Pages

# 触发条件：当代码推送到 main 分支时运行
on:
  push:
    branches:
      - main # 如果你的默认分支是 master，改成 master

# 权限设置：部署到 GitHub Pages 需要写入权限和 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务运行，避免并发冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------- 构建任务 ----------
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码，submodules: recursive 用于同步主题等子模块
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # 2. 安装 Node.js，版本需与本地开发环境一致
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24" # 改成你本地 node -v 显示的版本

      # 3. 缓存 node_modules，加快后续构建速度
      - name: Cache NPM dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache
          restore-keys: |
            ${{ runner.OS }}-npm-cache

      # 4. 安装项目依赖
      - name: Install Dependencies
        run: npm install

      # 5. 生成静态文件到 public 目录
      - name: Build
        run: npm run build

      # 6. 把 public 目录打包成 Pages 部署产物
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # ---------- 部署任务 ----------
  deploy:
    needs: build # 必须等 build 任务成功后才执行
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 7. 将构建产物发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
